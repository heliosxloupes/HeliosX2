<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Pupillary distance measurement diagram</title>
  <desc id="desc">A front-facing face diagram showing distance between the centers of both pupils.</desc>
  <rect width="1200" height="760" fill="#020617"/>
  <rect x="70" y="70" width="1060" height="620" rx="36" fill="#08111f" stroke="#1f2937" stroke-width="2"/>
  <circle cx="600" cy="350" r="230" fill="#111827" stroke="#334155" stroke-width="4"/>
  <path d="M420 332 C460 294 522 294 562 332" fill="none" stroke="#94a3b8" stroke-width="10" stroke-linecap="round"/>
  <path d="M638 332 C678 294 740 294 780 332" fill="none" stroke="#94a3b8" stroke-width="10" stroke-linecap="round"/>
  <circle cx="492" cy="350" r="34" fill="#e2e8f0"/>
  <circle cx="708" cy="350" r="34" fill="#e2e8f0"/>
  <circle cx="492" cy="350" r="12" fill="#020617"/>
  <circle cx="708" cy="350" r="12" fill="#020617"/>
  <line x1="492" y1="432" x2="708" y2="432" stroke="#34d399" stroke-width="8" stroke-linecap="round"/>
  <line x1="492" y1="405" x2="492" y2="459" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
  <line x1="708" y1="405" x2="708" y2="459" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
  <text x="600" y="500" text-anchor="middle" fill="#d1fae5" font-family="Arial, sans-serif" font-size="40" font-weight="700">Pupillary Distance (PD)</text>
  <text x="600" y="556" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="25">Measure center of pupil to center of pupil</text>
  <text x="118" y="132" fill="#86efac" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="5">HELIOSX MEASUREMENTS</text>
</svg>
