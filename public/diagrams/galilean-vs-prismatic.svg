<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Galilean versus prismatic loupe diagram</title>
  <desc id="desc">A simplified comparison of Galilean and prismatic loupe optical paths.</desc>
  <rect width="1200" height="760" fill="#020617"/>
  <rect x="70" y="70" width="500" height="620" rx="36" fill="#07111f" stroke="#1f2937" stroke-width="2"/>
  <rect x="630" y="70" width="500" height="620" rx="36" fill="#08111f" stroke="#1f2937" stroke-width="2"/>
  <text x="320" y="142" text-anchor="middle" fill="#7dd3fc" font-family="Arial, sans-serif" font-size="38" font-weight="800">Galilean</text>
  <text x="880" y="142" text-anchor="middle" fill="#86efac" font-family="Arial, sans-serif" font-size="38" font-weight="800">Prismatic</text>
  <circle cx="190" cy="352" r="54" fill="#111827" stroke="#475569" stroke-width="4"/>
  <circle cx="450" cy="352" r="54" fill="#111827" stroke="#475569" stroke-width="4"/>
  <line x1="244" y1="352" x2="396" y2="352" stroke="#7dd3fc" stroke-width="8" stroke-linecap="round"/>
  <path d="M190 462 C250 520 390 520 450 462" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
  <text x="320" y="582" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="25">Often lighter and approachable</text>
  <text x="320" y="620" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="22">Strong entry path for broad use</text>
  <polygon points="780,302 920,352 780,402" fill="#134e4a" stroke="#34d399" stroke-width="5"/>
  <line x1="706" y1="352" x2="780" y2="352" stroke="#86efac" stroke-width="8" stroke-linecap="round"/>
  <line x1="920" y1="352" x2="1052" y2="272" stroke="#86efac" stroke-width="8" stroke-linecap="round"/>
  <path d="M748 472 C810 532 950 532 1010 472" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
  <text x="880" y="582" text-anchor="middle" fill="#d1fae5" font-family="Arial, sans-serif" font-size="25">Posture-aware optical path</text>
  <text x="880" y="620" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="22">HeliosX Medusa and Apollo</text>
</svg>
